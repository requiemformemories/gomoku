// Board skins. Everything the canvas paints comes from here; markers (hint green, threat
// red/orange, forbidden cross) stay constant across skins so the legend keeps meaning.

    sheen: 'rgba(140,190,255,.11)', edge: 'rgba(255,255,255,.11)',
    grid: 'rgba(178,205,240,.17)', star: 'rgba(160,200,245,.4)',
    text: 'rgba(206,222,242,.45)', shadow: 'rgba(0,0,0,.6)',
  },

    sheen: 'rgba(255,242,214,.18)', edge: 'rgba(92,62,26,.5)',
    grid: 'rgba(85,58,25,.55)', star: 'rgba(70,46,18,.8)',
    text: 'rgba(72,48,18,.75)', shadow: 'rgba(60,35,10,.45)',
  },
  paper: {
    acc: '#4a7fb5', board: ['#f8f5ee', '#f1ede2', '#e6e0d2'],
    sheen: 'rgba(255,255,255,.5)', edge: 'rgba(120,110,95,.35)',
    grid: 'rgba(70,66,58,.42)', star: 'rgba(60,56,48,.7)',
    text: 'rgba(80,74,64,.7)', shadow: 'rgba(90,80,60,.28)',
  },
  neon: {
    acc: '#22e6c8', board: ['#0e1822', '#0a1018', '#05080c'],
    sheen: 'rgba(0,255,220,.07)', edge: 'rgba(0,255,220,.28)',
    grid: 'rgba(0,240,210,.2)', star: 'rgba(0,255,220,.55)',
    text: 'rgba(120,255,235,.5)', shadow: 'rgba(0,0,0,.75)',
  },
  mono: {
    acc: '#c4c4c4', board: ['#2c2c2c', '#262626', '#1f1f1f'],
    sheen: 'rgba(255,255,255,.04)', edge: 'rgba(255,255,255,.14)',
    grid: 'rgba(255,255,255,.18)', star: 'rgba(255,255,255,.32)',
    text: 'rgba(255,255,255,.4)', shadow: 'rgba(0,0,0,.5)',
  },
};

// Stone sets, independent of the board skin. Each side keeps a clear light/dark
// separation — they are game pieces first, decoration second.
const STONES = {
  classic: {
    black: { fill: ['#75808f', '#2c333e', '#06080c'], rim: 'rgba(190,215,255,.2)',
             spec: 'rgba(255,255,255,.26)', ink: 'rgba(238,245,255,.95)' },
    white: { fill: ['#ffffff', '#eef2f7', '#a8b3c0'], rim: 'rgba(25,35,50,.22)',
             spec: 'rgba(255,255,255,.9)', ink: 'rgba(16,24,36,.92)' },
  },
  neon: {
    black: { fill: ['#2a6a80', '#0c2029', '#01070c'], rim: 'rgba(0,255,220,.7)',
             spec: 'rgba(150,255,240,.42)', ink: 'rgba(160,255,240,.95)' },
    white: { fill: ['#fff9fc', '#f6dcea', '#d49dbd'], rim: 'rgba(96,32,72,.26)',
             spec: 'rgba(255,255,255,.92)', ink: 'rgba(58,16,48,.9)' },
  },
  jade: {
    black: { fill: ['#4e9a7a', '#1c4436', '#04140e'], rim: 'rgba(150,255,205,.28)',
             spec: 'rgba(205,255,232,.34)', ink: 'rgba(226,255,240,.95)' },
    white: { fill: ['#ffffff', '#f1f8f2', '#c1d6c7'], rim: 'rgba(40,70,55,.28)',
             spec: 'rgba(255,255,255,.92)', ink: 'rgba(24,44,34,.9)' },
  },
  sunset: {
    black: { fill: ['#7a5f9e', '#2f2044', '#100a1a'], rim: 'rgba(226,200,255,.28)',
             spec: 'rgba(245,228,255,.32)', ink: 'rgba(246,236,255,.95)' },
    white: { fill: ['#fffbf3', '#ffeed6', '#e2bd93'], rim: 'rgba(110,66,20,.26)',
             spec: 'rgba(255,255,255,.92)', ink: 'rgba(72,42,10,.9)' },
  },
};

const load = (k, d) => { try { const v = localStorage.getItem('gk.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem('gk.' + k, JSON.stringify(v)); } catch {} };

let lang = load('lang', navigator.language.startsWith('zh') ? 'zh' : 'en');
const t = (k, v) => (I18N[lang][k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v?.[n] ?? '');

const S = {
  board: newBoard(), history: [], turn: BLACK, over: null, thinking: false,
  human: load('human', BLACK), level: load('level', 'medium'),
  rules: load('rules', { doubleThree: true, doubleFour: true, overline: true }),
  coach: load('coach', true), showThreats: load('showThreats', false), tempo: load('tempo', true),
  showNumbers: load('showNumbers', true),
  theme: load('theme', 'slate'), stones: load('stones', 'classic'),
  anim: (v => typeof v === 'string' ? v : v ? 'pop' : 'off')(load('anim', 'off')),
  showForbidden: load('showForbidden', true),
  needConfirm: load('needConfirm', matchMedia('(pointer: coarse)').matches),
  hint: null, pending: null, msg: '', hover: null,
  winLine: null, marks: { threats: [], forbidden: [] },
  review: null,
  view: null,        // { i: plies shown, playing, at: point to suggest } — the replay viewer
};

const $ = s => document.querySelector(s);
const cv = $('#board'), ctx = cv.getContext('2d');

// --- rendering ---------------------------------------------------------------
let cell = 0, pad = 0, clock = 0, raf = 0, drop = null;
const slowMo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const skin = () => THEMES[S.theme] || THEMES.slate;
const pieces = () => STONES[S.stones] || STONES.classic;
// each effect says how long it runs and whether the stone itself scales in
const FX = {
  pop:     { ms: 220, scale: true },
  ripple:  { ms: 520, scale: false },
  sparkle: { ms: 620, scale: true },
  rainbow: { ms: 700, scale: true },
};
const fx = () => (slowMo ? null : FX[S.anim]);

function resize() {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth;
  cv.width = cv.height = Math.round(w * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cell = w / (SIZE + 1);
  pad = cell;
  draw();
}

const at = p => { const [x, y] = xy(p); return [pad + x * cell, pad + y * cell]; };

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// easeOutBack — the stone overshoots slightly, then settles
const pop = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (k - 1) ** 3 + c1 * (k - 1) ** 2; };
const pulse = () => slowMo ? 1 : (Math.sin(clock / 420) + 1) / 2;
// progress of the drop-in animation; same clock as its start, or it can stall
const dropK = () => drop ? Math.min(1, (performance.now() - drop.t0) / drop.ms) : 1;
const scaleK = () => drop ? Math.min(1, (performance.now() - drop.t0) / 220) : 1;

function stone(p, c, alpha = 1, scale = 1) {
  const [cx, cy] = at(p), r = cell * 0.45 * scale;
  if (r <= 0) return;
  const s = c === BLACK ? pieces().black : pieces().white, T = skin();
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = T.shadow;
  ctx.shadowBlur = r * 0.7;
  ctx.shadowOffsetY = r * 0.22;
  const g = ctx.createRadialGradient(cx - r * 0.34, cy - r * 0.42, r * 0.05, cx, cy, r * 1.08);
  g.addColorStop(0, s.fill[0]);
  g.addColorStop(c === BLACK ? .32 : .42, s.fill[1]);
  g.addColorStop(1, s.fill[2]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.shadowBlur = ctx.shadowOffsetY = 0;
  ctx.strokeStyle = s.rim;
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.stroke();
  ctx.fillStyle = s.spec;
  ctx.beginPath(); ctx.ellipse(cx - r * 0.3, cy - r * 0.36, r * 0.3, r * 0.17, -0.5, 0, 7); ctx.fill();
  ctx.restore();
}

// the position after the first `S.view.i` plies — black opens, so parity gives the colour
function viewBoard() {
  const b = newBoard();
  for (let k = 0; k < S.view.i; k++) b[S.history[k]] = k % 2 ? WHITE : BLACK;
  return b;
}

function startFx(p) {
  const f = fx();
  if (f) drop = { p, t0: performance.now(), ms: f.ms };
}

// The flourish on a freshly placed stone. `k` runs 0 -> 1 over the effect's duration.
function drawFx(p, k) {
  const [cx, cy] = at(p), r0 = cell * 0.45, ease = 1 - (1 - k) ** 2;
  ctx.save();
  if (S.anim === 'ripple') {
    const acc = skin().acc;
    const flash = ctx.createRadialGradient(cx, cy, r0, cx, cy, r0 + cell * 1.5 * ease);
    flash.addColorStop(0, 'transparent');
    flash.addColorStop(.75, acc);
    flash.addColorStop(1, 'transparent');
    ctx.globalAlpha = (1 - k) * 0.45;
    ctx.fillStyle = flash;
    ctx.beginPath(); ctx.arc(cx, cy, r0 + cell * 1.5 * ease, 0, 7); ctx.fill();
    for (const lag of [0, 0.3]) {
      const t = (k - lag) / (1 - lag);
      if (t <= 0) continue;
      const e = 1 - (1 - t) ** 2;
      const rr = r0 + cell * 1.35 * e, lw = Math.max(2, cell * 0.15 * (1 - t * 0.5));
      ctx.globalAlpha = 1 - t * t;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7);
      ctx.shadowBlur = 0;                      // a dark keyline first, so it reads on any board
      ctx.strokeStyle = 'rgba(0,0,0,.4)';
      ctx.lineWidth = lw + 2.5;
      ctx.stroke();
      ctx.strokeStyle = acc;
      ctx.shadowColor = acc;
      ctx.shadowBlur = cell * 0.6;
      ctx.lineWidth = lw;
      ctx.stroke();
    }
  } else if (S.anim === 'sparkle') {
    const n = 10;
    ctx.shadowColor = '#ffcf5c';
    ctx.shadowBlur = cell * 0.35;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + (p % 9) * 0.17;   // per-point jitter, no RNG needed
      const rad = cell * 0.11 * (1 - k);
      if (rad <= 0) continue;
      const d = r0 * 0.5 + cell * 1.2 * ease;
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = i % 3 ? '#fff3c4' : '#ffd166';
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, rad, 0, 7); ctx.fill();
    }
  } else if (S.anim === 'rainbow') {
    const seg = 12, span = (Math.PI * 2 / seg) * 0.92;
    ctx.globalAlpha = 1 - k * k;
    ctx.lineWidth = Math.max(1.5, cell * 0.14 * (1 - k * 0.6));
    ctx.lineCap = 'round';
    for (let i = 0; i < seg; i++) {
      const a0 = (i / seg) * Math.PI * 2 + k * 3.2;
      ctx.strokeStyle = `hsl(${(i / seg) * 360} 95% 62%)`;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = cell * 0.3;
      ctx.beginPath(); ctx.arc(cx, cy, r0 + cell * 0.95 * ease, a0, a0 + span); ctx.stroke();
    }
  }
  ctx.restore();
}

function moveNo(p, c, n) {
  if (!n) return;
  const [cx, cy] = at(p);
  ctx.save();
  ctx.fillStyle = (c === BLACK ? pieces().black : pieces().white).ink;
  ctx.font = `700 ${Math.max(7, cell * (n > 99 ? 0.31 : 0.4))}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(n, cx, cy);
  ctx.restore();
}

function glowRing(p, color, { r = 0.42, w = 0.075, glow = 0.55, dash = false, alpha = 1 } = {}) {
  const [cx, cy] = at(p);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color; ctx.shadowBlur = cell * glow;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, cell * w);
  ctx.setLineDash(dash ? [cell * 0.14, cell * 0.14] : []);
  ctx.beginPath(); ctx.arc(cx, cy, cell * r, 0, 7); ctx.stroke();
  ctx.restore();
}

function cross(p, color) {
  const [cx, cy] = at(p), r = cell * 0.24;
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = cell * 0.4;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, cell * 0.09); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
  ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
  ctx.stroke();
  ctx.restore();
}

function drawBoard(w) {
  const T = skin();
  ctx.clearRect(0, 0, w, w);
  roundRect(0.5, 0.5, w - 1, w - 1, w * 0.035);
  const g = ctx.createLinearGradient(0, 0, w * 0.7, w);
  g.addColorStop(0, T.board[0]); g.addColorStop(.5, T.board[1]); g.addColorStop(1, T.board[2]);
  ctx.fillStyle = g; ctx.fill();
  const sheen = ctx.createRadialGradient(w * 0.22, w * 0.1, 0, w * 0.22, w * 0.1, w * 0.85);
  sheen.addColorStop(0, T.sheen); sheen.addColorStop(1, 'transparent');
  ctx.fillStyle = sheen; ctx.fill();
  ctx.strokeStyle = T.edge; ctx.lineWidth = 1; ctx.stroke();

  const last = pad + (SIZE - 1) * cell;
  ctx.strokeStyle = T.grid;
  ctx.lineWidth = Math.max(1, cell * 0.022);
  ctx.beginPath();
  for (let i = 0; i < SIZE; i++) {
    const v = pad + i * cell;
    ctx.moveTo(pad, v); ctx.lineTo(last, v);
    ctx.moveTo(v, pad); ctx.lineTo(v, last);
  }
  ctx.stroke();

  ctx.fillStyle = T.star;
  for (const [x, y] of [[3, 3], [11, 3], [3, 11], [11, 11], [7, 7]]) {
    ctx.beginPath(); ctx.arc(pad + x * cell, pad + y * cell, cell * 0.09, 0, 7); ctx.fill();
  }

  ctx.fillStyle = T.text;
  ctx.font = `600 ${Math.max(8, cell * 0.34)}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < SIZE; i++) {
    ctx.fillText('ABCDEFGHIJKLMNO'[i], pad + i * cell, pad * 0.42);
    ctx.fillText(String(SIZE - i), pad * 0.42, pad + i * cell);
  }
}

function draw() {
  const w = cv.clientWidth;
  if (!w) return;
  drawBoard(w);

  const bd = S.view ? viewBoard() : S.board;
  const order = S.showNumbers ? new Map(S.history.map((q, i) => [q, i + 1])) : null;
  const grows = drop && FX[S.anim]?.scale, sk = scaleK();
  for (let p = 0; p < bd.length; p++) {
    if (!bd[p]) continue;
    const growing = grows && drop.p === p;
    stone(p, bd[p], growing ? Math.min(1, sk * 2) : 1, growing ? pop(sk) : 1);
    if (order && !growing) moveNo(p, bd[p], order.get(p));
  }
  if (drop && bd[drop.p]) drawFx(drop.p, dropK());
  if (viewingPast()) {                   // mid-replay: ring the move shown, and a better one
    const shown = S.history[S.view.i - 1];
    if (shown != null) glowRing(shown, S.view.at != null ? 'rgba(255,86,86,.95)' : '#8ab4f8', { w: 0.09 });
    if (S.view.at != null) glowRing(S.view.at, '#3ddc84', { w: 0.09 });
    return;
  }

  const last = S.history.at(-1);
  if (last != null && !S.winLine && !S.showNumbers) {   // the number already says which was last
    const [cx, cy] = at(last);
    ctx.fillStyle = (S.board[last] === BLACK ? pieces().black : pieces().white).ink;
    ctx.beginPath(); ctx.arc(cx, cy, cell * 0.09, 0, 7); ctx.fill();
  }

  if (S.winLine) {
    const [ax, ay] = at(S.winLine[0]), [bx, by] = at(S.winLine.at(-1));
    ctx.save();
    ctx.strokeStyle = `rgba(94,240,170,${0.5 + 0.4 * pulse()})`;
    ctx.shadowColor = '#3ddc84'; ctx.shadowBlur = cell * (0.7 + 0.6 * pulse());
    ctx.lineWidth = cell * 0.13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.restore();
  } else {
    for (const [p, d] of S.marks.threats)
      glowRing(p, d === 2 ? 'rgba(255,86,86,.95)' : 'rgba(255,168,64,.95)', { dash: d === 1 });
    for (const p of S.marks.forbidden) cross(p, 'rgba(255,72,72,.95)');
  }

  if (S.hint != null) glowRing(S.hint, '#3ddc84', { w: 0.09, glow: 0.5 + 1.1 * pulse() });
  if (S.hover != null && S.pending == null && !S.over && !S.thinking && S.turn === S.human && !S.board[S.hover])
    stone(S.hover, S.human, 0.28);
  if (S.pending != null) {
    stone(S.pending, S.turn, 0.55);
    glowRing(S.pending, '#3ddc84', { w: 0.06 });
  }
}

const viewingPast = () => !!S.view && S.view.i < S.history.length;
function animating() {
  return !slowMo && (!!drop || (!viewingPast() && (S.hint != null || S.winLine)));
}

function frame(now) {
  clock = now;
  if (drop && dropK() >= 1) drop = null;
  draw();
  raf = animating() ? requestAnimationFrame(frame) : 0;
}

function kick() { if (!raf) raf = requestAnimationFrame(frame); }

// Threat / forbidden markers only change when the board or the settings do.
function recomputeMarks() {
  S.marks = { threats: [], forbidden: [] };
  if (S.over) return;
  if (S.showThreats) S.marks.threats = threats(S.board, other(S.human), S.rules);
  if (S.showForbidden && S.human === BLACK)
    S.marks.forbidden = candidates(S.board).filter(p => forbidden(S.board, p, S.rules));
}


// --- i18n / ui ---------------------------------------------------------------
function applyI18n() {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.title = t('title') + ' · Gomoku';
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('#lang').textContent = lang === 'zh' ? 'EN' : '中文';
  render();
}

const STEP_MS = 650;
let pbTimer = 0;

function pbSet(i, keepPlaying = false) {
  if (!S.history.length) return;
  if (!keepPlaying) pbPause();
  S.view = { i: Math.max(0, Math.min(S.history.length, i)), at: null };
  render();
}

function pbPause() { clearTimeout(pbTimer); pbTimer = 0; if (S.view) S.view.playing = false; }

function pbTick() {
  if (!S.view?.playing) return;
  S.view.i++;
  S.view.at = null;
  startFx(S.history[S.view.i - 1]);
  if (S.view.i >= S.history.length) S.view.playing = false;   // stop on the last move, not after it
  render();
  if (S.view.playing) pbTimer = setTimeout(pbTick, STEP_MS);
}

function pbPlay() {
  if (!S.history.length) return;
  if (!S.view || S.view.i >= S.history.length) S.view = { i: 0, at: null };
  S.view.playing = true;
  render();
  pbTimer = setTimeout(pbTick, STEP_MS);
}

function pbClear() { pbPause(); S.view = null; }

function renderPlayback() {
  const el = $('#playback');
  el.hidden = !S.view;
  if (!S.view) return;
  const n = S.history.length, i = S.view.i;
  $('#pbPlay').textContent = t(S.view.playing ? 'pbPause' : 'pbPlay');
  $('#pbPrev').disabled = i === 0;
  $('#pbFirst').disabled = i === 0;
  $('#pbNext').disabled = i >= n;
  $('#pbLast').disabled = i >= n;
  const sl = $('#pbSlider');
  sl.max = n;
  sl.value = i;
  $('#pbAt').textContent = i === 0 ? t('pbStart')
    : t('pbAt', { i, n, who: t((i - 1) % 2 ? 'pbWhite' : 'pbBlack'), p: label(S.history[i - 1]) });
}

function renderReview() {
  const el = $('#review');
  el.hidden = !S.review;
  if (!S.review) { el.innerHTML = ''; return; }
  const row = (m, good) => `<button class="rv ${good ? 'good' : 'bad'}" data-ply="${m.ply}">
      <b>#${m.n}</b><span class="pt">${label(m.p)}</span>
      <span>${t('rv_' + m.key)}${!good && m.at != null ? ` <i>${t('reviewBetter', { p: label(m.at) })}</i>` : ''}</span>
    </button>`;
  const { best, worst } = S.review;
  el.innerHTML = `<h2>${t('reviewHead')}</h2>
    <h3>${t('reviewBest')}</h3>
    ${best.length ? best.map(m => row(m, true)).join('') : `<p class="rvNote">${t('reviewNone')}</p>`}
    <h3>${t('reviewWorst')}</h3>
    ${worst.length ? worst.map(m => row(m, false)).join('') : `<p class="rvNote">${t('reviewClean')}</p>`}
    <p class="rvNote">${t('reviewTap')}</p>`;
}

const REPO = 'https://github.com/requiemformemories/gomoku';

// A game as a link. Plain coordinates, not an encoding: short enough already, readable in a
// bug report, hand-editable, and it can never fall out of sync with a second notation.
function gameUrl() {
  const r = [S.rules.doubleThree, S.rules.doubleFour, S.rules.overline].map(v => (v ? 1 : 0)).join('');
  return `${location.origin}${location.pathname}?g=${S.history.map(label).join(',')}`
       + `&r=${r}&s=${S.human === BLACK ? 'b' : 'w'}`;
}

/** Restore a game from ?g=…&r=…&s=… — returns false if there was nothing usable to load. */
function loadFromUrl() {
  const q = new URLSearchParams(location.search);
  if (!q.has('g')) return false;
  const moves = parsePoints(q.get('g'));
  if (!moves) { S.msg = t('badLink'); return false; }

  const r = q.get('r'), side = q.get('s');
  // applied for this visit only: a shared link must not rewrite your saved settings
  if (/^[01]{3}$/.test(r || '')) S.rules = { doubleThree: r[0] === '1', doubleFour: r[1] === '1', overline: r[2] === '1' };
  if (side === 'b') S.human = BLACK;
  else if (side === 'w') S.human = WHITE;

  S.board = newBoard();
  S.history = moves.slice();
  moves.forEach((p, i) => { S.board[p] = i % 2 ? WHITE : BLACK; });
  const last = S.history.at(-1);
  S.winLine = lineThrough(S.board, last, S.rules);
  if (S.winLine) S.over = S.board[last] === S.human ? 'youWin' : 'aiWin';
  S.turn = S.history.length % 2 ? WHITE : BLACK;
  if (S.over) S.review = review(S.history, S.rules, S.human, 'medium');
  S.view = { i: S.history.length, at: null };   // land on the final position, controls ready
  return true;
}
const build = () => document.lastModified;   // the deployed file's date — no build step to stamp one

// Everything needed to replay the game, and nothing else. The user sees it in GitHub's
// editor and can delete any of it before submitting; we never hold a copy.
function gameState() {
  const R = S.rules, on = v => (v ? 'on' : 'off');
  return [
    `replay: ${gameUrl()}`,
    `you: ${S.human === BLACK ? 'black' : 'white'} · level: ${S.level} · result: ${S.over || 'in progress'}`,
    `rules: 3-3 ${on(R.doubleThree)}, 4-4 ${on(R.doubleFour)}, overline ${on(R.overline)}`,
    `view: ${innerWidth}x${innerHeight} · lang: ${lang} · build: ${build()}`,
    `ua: ${navigator.userAgent}`,
  ].join('\n');
}

function render() {
  document.documentElement.style.setProperty('--acc', skin().acc);
  $('#copyLink').disabled = !S.history.length;
  $('#bugLink').href = `${REPO}/issues/new?template=bug.yml&state=${encodeURIComponent(gameState())}`;
  $('#ideaLink').href = `${REPO}/issues/new?template=feature.yml&build=${encodeURIComponent(build())}`;
  $('#status').textContent = S.over ? t(S.over)
    : S.thinking ? t('aiTurn')
    : S.turn === S.human ? t('yourTurn') : t('aiToMove');
  $('#msg').innerHTML = S.msg;
  $('#undo').disabled = !S.history.length || S.thinking;
  $('#hint').disabled = !!S.over || S.thinking || S.turn !== S.human;
  $('#confirmRow').hidden = S.pending == null;
  renderPlayback();
  renderReview();
  draw();
  kick();
}

function say(html) { S.msg = html; render(); }

// --- game flow ---------------------------------------------------------------
function place(p) {
  S.hint = S.pending = S.hover = null;
  S.board[p] = S.turn;
  S.history.push(p);
  startFx(p);
  S.winLine = winLine(S.board, p, S.rules);
  if (S.winLine) S.over = S.turn === S.human ? 'youWin' : 'aiWin';
  else if (S.history.length === SIZE * SIZE) S.over = 'draw';
  else S.turn = other(S.turn);
  recomputeMarks();
  if (S.over) {
    S.review = review(S.history, S.rules, S.human, 'medium');
    pbPlay();                            // the board becomes a replay of the game just played
  }
  if (!S.over && S.turn === S.human) {
    const lose = fiveThreats(S.board, other(S.human), S.rules);
    if (lose.length >= 2) S.msg = t('doomed', { a: label(lose[0]), b: label(lose[1]) });
  }
  render();
  if (!S.over && S.turn !== S.human) aiTurn();
}

function humanMove(p) {
  if (S.over || S.thinking || S.turn !== S.human || S.board[p]) return;
  if (S.human === BLACK) {
    const f = forbidden(S.board, p, S.rules);
    if (f) { S.pending = null; say(t('fb_' + f)); return; }
  }
  if (S.needConfirm && S.pending !== p) { S.pending = p; S.msg = ''; render(); return; }
  commit(p);
}

function commit(p) {
  const note = S.coach ? coach(S.board, p, S.human, S.rules) : null;
  const tv = S.tempo ? tempo(S.board, p, S.human, S.rules) : null;   // both need the pre-move board
  const text = note ? t(note.key, { p: note.at != null ? label(note.at) : '' })
             : tv && tv !== 'win' ? t('tempo_' + tv) : '';
  place(p);
  say(S.over ? '' : text);
}

function aiTurn() {
  S.thinking = true; render();
  // ponytail: search runs on the main thread; move to a Worker if the freeze annoys.
  setTimeout(() => {
    const p = bestMove(S.board, S.turn, S.rules, S.level);
    S.thinking = false;
    if (p == null) { S.over = 'draw'; render(); return; }
    place(p);
  }, 30);
}

function newGame() {
  if (location.search) history.replaceState(null, '', location.pathname);
  S.board = newBoard(); S.history = []; S.turn = BLACK; S.over = null;
  S.hint = S.pending = S.hover = S.winLine = S.review = null; S.msg = '';
  pbClear();
  recomputeMarks();
  render();
  if (S.turn !== S.human) aiTurn();
}

// --- events ------------------------------------------------------------------
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left - pad) / cell), y = Math.round((e.clientY - r.top - pad) / cell);
  if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
  humanMove(idx(x, y));
});

cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const r = cv.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left - pad) / cell), y = Math.round((e.clientY - r.top - pad) / cell);
  const p = (x >= 0 && x < SIZE && y >= 0 && y < SIZE) ? idx(x, y) : null;
  if (p !== S.hover) { S.hover = p; draw(); }
});
cv.addEventListener('pointerleave', () => { if (S.hover != null) { S.hover = null; draw(); } });

$('#ok').onclick = () => { const p = S.pending; S.pending = null; if (p != null) commit(p); };
$('#cancel').onclick = () => { S.pending = null; render(); };
$('#review').addEventListener('click', e => {
  const btn = e.target.closest('button[data-ply]');
  if (!btn || !S.review) return;
  const m = [...S.review.best, ...S.review.worst].find(x => x.ply === +btn.dataset.ply);
  if (!m) return;
  pbSet(m.ply);
  S.view.at = m.score < 0 ? m.at : null;
  render();
});

$('#pbFirst').onclick = () => pbSet(0);
$('#pbPrev').onclick = () => S.view && pbSet(S.view.i - 1);
$('#pbNext').onclick = () => S.view && pbSet(S.view.i + 1);
$('#pbLast').onclick = () => pbSet(S.history.length);
$('#pbPlay').onclick = () => (S.view?.playing ? (pbPause(), render()) : pbPlay());
$('#pbSlider').oninput = e => pbSet(+e.target.value);

// The address bar gets the link too, so a refresh or bookmark keeps the game either way.
$('#copyLink').onclick = async e => {
  const btn = e.currentTarget;      // grab it before awaiting: currentTarget is null by then
  const url = gameUrl();
  history.replaceState(null, '', url);
  let key = 'copied';
  try { await navigator.clipboard.writeText(url); } catch { key = 'copyBar'; }
  btn.textContent = t(key);
  setTimeout(() => { btn.textContent = t('copyLink'); }, 1800);
};

$('#newGame').onclick = newGame;
// black always opens, so the side to move follows from how many stones are down
const sideToMove = () => (S.history.length % 2 ? WHITE : BLACK);

$('#undo').onclick = () => {
  if (S.thinking || !S.history.length) return;
  do { S.board[S.history.pop()] = EMPTY; }        // take back at least one...
  while (S.history.length && sideToMove() !== S.human);   // ...then back to your turn
  S.over = null; S.hint = S.pending = S.hover = S.winLine = S.review = null; S.msg = '';
  pbClear();
  S.turn = sideToMove();
  recomputeMarks();
  render();
  if (S.turn !== S.human) aiTurn();
};
$('#hint').onclick = () => {
  if (!legalMoves(S.board, S.human, S.rules).length) return say(t('noMove'));
  const h = getHint(S.board, S.human, S.rules, S.level === 'easy' ? 'medium' : S.level);
  if (!h) return;
  S.hint = h.move;
  say(h.reason === 'lost' ? t('lost') : t('hintTip', { p: label(h.move), why: t(h.reason) }));
};
$('#lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; save('lang', lang); applyI18n(); };

const linked = loadFromUrl();   // before the controls are filled in, so they show the link's rules

const bind = (sel, key, get, set) => {
  const el = $(sel); set(el);
  el.onchange = () => { get(el); save(key, key === 'rules' ? S.rules : S[key]); recomputeMarks(); render(); };
};
bind('#level', 'level', el => S.level = el.value, el => el.value = S.level);
bind('#theme', 'theme', el => S.theme = el.value, el => el.value = S.theme);
bind('#stones', 'stones', el => S.stones = el.value, el => el.value = S.stones);
bind('#anim', 'anim', el => S.anim = el.value, el => el.value = S.anim);
bind('#side', 'human', el => { S.human = +el.value; save('human', S.human); newGame(); }, el => el.value = S.human);
for (const k of ['doubleThree', 'doubleFour', 'overline'])
  bind('#' + k, 'rules', el => S.rules[k] = el.checked, el => el.checked = S.rules[k]);
for (const k of ['coach', 'showThreats', 'showForbidden', 'needConfirm', 'tempo', 'showNumbers'])
  bind('#' + k, k, el => S[k] = el.checked, el => el.checked = S[k]);

addEventListener('resize', resize);
recomputeMarks();
applyI18n();
resize();
if (!linked && S.turn !== S.human) aiTurn();
</script>
</body>
</html>
