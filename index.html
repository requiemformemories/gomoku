<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2126">
<title>五子棋練習 · Gomoku Trainer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  :root { --bg:#1d2126; --fg:#e8e6e1; --dim:#9aa1a9; --line:#333a42; --acc:#5aa9e6; }
  body { margin:0; color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #26313d 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, #1f2a38 0%, transparent 55%),
      var(--bg);
    background-attachment: fixed; }
  header { display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem; border-bottom:1px solid var(--line); }
  h1 { font-size:1.05rem; margin:0; font-weight:600; flex:1; min-width:0; }
  main { display:grid; grid-template-columns:1fr; gap:1rem; padding:.75rem; justify-items:center; }
  #boardWrap { width:min(100%, 62vh); aspect-ratio:1; touch-action:manipulation; }
  canvas { width:100%; height:100%; display:block;
    filter: drop-shadow(0 16px 34px rgba(0,0,0,.55)); }
  #panel { width:100%; max-width:420px; display:flex; flex-direction:column; gap:.6rem; }
  @media (min-width:820px) {
    main { grid-template-columns:auto minmax(260px,360px); align-items:start; justify-content:center; padding:1rem; }
    #boardWrap { width:min(58vw, 86vh); }
  }
  #status { font-weight:600; margin:0; }
  #msg { margin:0; min-height:2.4em; color:var(--dim); font-size:.9rem; }
  #msg b { color:var(--acc); }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; }
  button, select { font:inherit; color:var(--fg); border:1px solid var(--line); border-radius:10px;
    padding:.5rem .8rem; cursor:pointer; background:linear-gradient(#2f3743, #262d37);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 6px rgba(0,0,0,.3); transition:filter .12s; }
  button:hover:not(:disabled) { filter:brightness(1.18); }
  button:active { filter:brightness(.92); }
  button.primary { background:linear-gradient(#6fb8f0, #3d8fd0); color:#0b1118; border-color:transparent;
    font-weight:600; box-shadow:0 2px 14px rgba(90,169,230,.4); }
  button:disabled { opacity:.45; cursor:default; }
  .row > button { flex:1 1 auto; }
  details { border:1px solid var(--line); border-radius:12px; padding:.5rem .7rem;
    background:rgba(255,255,255,.025); backdrop-filter:blur(6px); }
  summary { cursor:pointer; font-weight:600; }
  label { display:flex; align-items:center; gap:.5rem; margin:.5rem 0; font-size:.92rem; }
  label input { width:1.05rem; height:1.05rem; accent-color:var(--acc); }
  label select { flex:1; padding:.35rem .5rem; }
  .hr { border-top:1px solid var(--line); margin:.6rem -.7rem; }
  .legend { font-size:.8rem; color:var(--dim); }
  #review { border:1px solid var(--line); border-radius:12px; padding:.6rem .7rem;
    background:rgba(255,255,255,.025); display:flex; flex-direction:column; gap:.15rem; }
  #review h2 { font-size:.95rem; margin:0 0 .2rem; }
  #review h3 { font-size:.8rem; margin:.5rem 0 .15rem; color:var(--dim); font-weight:600; }
  button.rv { display:flex; gap:.5rem; align-items:baseline; width:100%; text-align:left;
    background:none; border:0; box-shadow:none; padding:.3rem .35rem; border-radius:8px; font-size:.86rem; }
  button.rv:hover { background:rgba(255,255,255,.06); filter:none; }
  button.rv b { color:var(--dim); font-weight:500; min-width:1.9rem; }
  button.rv .pt { font-variant-numeric:tabular-nums; font-weight:700; min-width:2.4rem; }
  button.rv .good .pt, .good { color:#5ee0a8; }
  button.rv .bad .pt, .bad { color:#ff7a7a; }
  button.rv i { font-style:normal; color:var(--acc); }
  .rvNote { font-size:.78rem; color:var(--dim); margin:.35rem 0 0; }
  #playback { border:1px solid var(--line); border-radius:12px; padding:.6rem .7rem;
    background:rgba(255,255,255,.025); }
  #playback h2 { font-size:.95rem; margin:0 0 .45rem; }
  .pbBtns { display:flex; gap:.4rem; }
  .pbBtns button { flex:1 1 auto; padding:.45rem .3rem; }
  .pbBtns #pbPlay { flex:2 1 auto; }
  #pbSlider { width:100%; margin:.6rem 0 0; accent-color:var(--acc); }
</style>
</head>

</main>

const load = (k, d) => { try { const v = localStorage.getItem('gk.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem('gk.' + k, JSON.stringify(v)); } catch {} };

let lang = load('lang', navigator.language.startsWith('zh') ? 'zh' : 'en');
const t = (k, v) => (I18N[lang][k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v?.[n] ?? '');

const S = {
  board: newBoard(), history: [], turn: BLACK, over: null, thinking: false,
  human: load('human', BLACK), level: load('level', 'medium'),
  rules: load('rules', { doubleThree: true, doubleFour: true, overline: true }),
  coach: load('coach', true), showThreats: load('showThreats', false), tempo: load('tempo', true),
  showNumbers: load('showNumbers', false),
  showForbidden: load('showForbidden', true),
  needConfirm: load('needConfirm', matchMedia('(pointer: coarse)').matches),
  hint: null, pending: null, msg: '', hover: null,
  winLine: null, marks: { threats: [], forbidden: [] },
  review: null,
  view: null,        // { i: plies shown, playing, at: point to suggest } — the replay viewer
};

const $ = s => document.querySelector(s);
const cv = $('#board'), ctx = cv.getContext('2d');

// --- rendering ---------------------------------------------------------------
let cell = 0, pad = 0, clock = 0, raf = 0, drop = null;
const slowMo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DROP_MS = 220;

function resize() {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth;
  cv.width = cv.height = Math.round(w * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cell = w / (SIZE + 1);
  pad = cell;
  draw();
}

const at = p => { const [x, y] = xy(p); return [pad + x * cell, pad + y * cell]; };

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// easeOutBack — the stone overshoots slightly, then settles
const pop = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (k - 1) ** 3 + c1 * (k - 1) ** 2; };
const pulse = () => slowMo ? 1 : (Math.sin(clock / 420) + 1) / 2;
// progress of the drop-in animation; same clock as its start, or it can stall
const dropK = () => drop ? Math.min(1, (performance.now() - drop.t0) / DROP_MS) : 1;

function stone(p, c, alpha = 1, scale = 1) {
  const [cx, cy] = at(p), r = cell * 0.45 * scale;
  if (r <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(0,0,0,.6)';
  ctx.shadowBlur = r * 0.7;
  ctx.shadowOffsetY = r * 0.22;
  const g = ctx.createRadialGradient(cx - r * 0.34, cy - r * 0.42, r * 0.05, cx, cy, r * 1.08);
  if (c === BLACK) {
    g.addColorStop(0, '#75808f'); g.addColorStop(.32, '#2c333e'); g.addColorStop(1, '#06080c');
  } else {
    g.addColorStop(0, '#ffffff'); g.addColorStop(.42, '#eef2f7'); g.addColorStop(1, '#a8b3c0');
  }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.shadowBlur = ctx.shadowOffsetY = 0;
  ctx.strokeStyle = c === BLACK ? 'rgba(190,215,255,.20)' : 'rgba(25,35,50,.22)';
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.stroke();
  ctx.fillStyle = c === BLACK ? 'rgba(255,255,255,.26)' : 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.ellipse(cx - r * 0.3, cy - r * 0.36, r * 0.3, r * 0.17, -0.5, 0, 7); ctx.fill();
  ctx.restore();
}

// the position after the first `S.view.i` plies — black opens, so parity gives the colour
function viewBoard() {
  const b = newBoard();
  for (let k = 0; k < S.view.i; k++) b[S.history[k]] = k % 2 ? WHITE : BLACK;
  return b;
}

function moveNo(p, c, n) {
  if (!n) return;
  const [cx, cy] = at(p);
  ctx.save();
  ctx.fillStyle = c === BLACK ? 'rgba(238,245,255,.95)' : 'rgba(16,24,36,.92)';
  ctx.font = `700 ${Math.max(7, cell * (n > 99 ? 0.31 : 0.4))}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(n, cx, cy);
  ctx.restore();
}

function glowRing(p, color, { r = 0.42, w = 0.075, glow = 0.55, dash = false, alpha = 1 } = {}) {
  const [cx, cy] = at(p);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color; ctx.shadowBlur = cell * glow;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, cell * w);
  ctx.setLineDash(dash ? [cell * 0.14, cell * 0.14] : []);
  ctx.beginPath(); ctx.arc(cx, cy, cell * r, 0, 7); ctx.stroke();
  ctx.restore();
}

function cross(p, color) {
  const [cx, cy] = at(p), r = cell * 0.24;
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = cell * 0.4;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, cell * 0.09); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
  ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
  ctx.stroke();
  ctx.restore();
}

function drawBoard(w) {
  ctx.clearRect(0, 0, w, w);
  roundRect(0.5, 0.5, w - 1, w - 1, w * 0.035);
  const g = ctx.createLinearGradient(0, 0, w * 0.7, w);
  g.addColorStop(0, '#35414f'); g.addColorStop(.5, '#242e3b'); g.addColorStop(1, '#171e28');
  ctx.fillStyle = g; ctx.fill();
  const sheen = ctx.createRadialGradient(w * 0.22, w * 0.1, 0, w * 0.22, w * 0.1, w * 0.85);
  sheen.addColorStop(0, 'rgba(140,190,255,.11)'); sheen.addColorStop(1, 'rgba(140,190,255,0)');
  ctx.fillStyle = sheen; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.11)'; ctx.lineWidth = 1; ctx.stroke();

  const last = pad + (SIZE - 1) * cell;
  ctx.strokeStyle = 'rgba(178,205,240,.17)';
  ctx.lineWidth = Math.max(1, cell * 0.022);
  ctx.beginPath();
  for (let i = 0; i < SIZE; i++) {
    const v = pad + i * cell;
    ctx.moveTo(pad, v); ctx.lineTo(last, v);
    ctx.moveTo(v, pad); ctx.lineTo(v, last);
  }
  ctx.stroke();

  ctx.fillStyle = 'rgba(160,200,245,.4)';
  for (const [x, y] of [[3, 3], [11, 3], [3, 11], [11, 11], [7, 7]]) {
    ctx.beginPath(); ctx.arc(pad + x * cell, pad + y * cell, cell * 0.09, 0, 7); ctx.fill();
  }

  ctx.fillStyle = 'rgba(206,222,242,.45)';
  ctx.font = `600 ${Math.max(8, cell * 0.34)}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < SIZE; i++) {
    ctx.fillText('ABCDEFGHIJKLMNO'[i], pad + i * cell, pad * 0.42);
    ctx.fillText(String(SIZE - i), pad * 0.42, pad + i * cell);
  }
}

function draw() {
  const w = cv.clientWidth;
  if (!w) return;
  drawBoard(w);

  const bd = S.view ? viewBoard() : S.board;
  const order = S.showNumbers ? new Map(S.history.map((q, i) => [q, i + 1])) : null;
  const k = dropK();
  for (let p = 0; p < bd.length; p++) {
    if (!bd[p]) continue;
    const growing = drop && drop.p === p;
    stone(p, bd[p], growing ? Math.min(1, k * 2) : 1, growing ? pop(k) : 1);
    if (order && !growing) moveNo(p, bd[p], order.get(p));
  }
  if (viewingPast()) {                   // mid-replay: ring the move shown, and a better one
    const shown = S.history[S.view.i - 1];
    if (shown != null) glowRing(shown, S.view.at != null ? 'rgba(255,86,86,.95)' : '#8ab4f8', { w: 0.09 });
    if (S.view.at != null) glowRing(S.view.at, '#3ddc84', { w: 0.09 });
    return;
  }

  const last = S.history.at(-1);
  if (last != null && !S.winLine && !S.showNumbers) {   // the number already says which was last
    const [cx, cy] = at(last);
    ctx.fillStyle = S.board[last] === BLACK ? 'rgba(230,240,255,.85)' : 'rgba(30,40,55,.8)';
    ctx.beginPath(); ctx.arc(cx, cy, cell * 0.09, 0, 7); ctx.fill();
  }

  if (S.winLine) {
    const [ax, ay] = at(S.winLine[0]), [bx, by] = at(S.winLine.at(-1));
    ctx.save();
    ctx.strokeStyle = `rgba(94,240,170,${0.5 + 0.4 * pulse()})`;
    ctx.shadowColor = '#3ddc84'; ctx.shadowBlur = cell * (0.7 + 0.6 * pulse());
    ctx.lineWidth = cell * 0.13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.restore();
  } else {
    for (const [p, d] of S.marks.threats)
      glowRing(p, d === 2 ? 'rgba(255,86,86,.95)' : 'rgba(255,168,64,.95)', { dash: d === 1 });
    for (const p of S.marks.forbidden) cross(p, 'rgba(255,72,72,.95)');
  }

  if (S.hint != null) glowRing(S.hint, '#3ddc84', { w: 0.09, glow: 0.5 + 1.1 * pulse() });
  if (S.hover != null && S.pending == null && !S.over && !S.thinking && S.turn === S.human && !S.board[S.hover])
    stone(S.hover, S.human, 0.28);
  if (S.pending != null) {
    stone(S.pending, S.turn, 0.55);
    glowRing(S.pending, '#3ddc84', { w: 0.06 });
  }
}

const viewingPast = () => !!S.view && S.view.i < S.history.length;
function animating() {
  return !slowMo && (!!drop || (!viewingPast() && (S.hint != null || S.winLine)));
}

function frame(now) {
  clock = now;
  if (drop && dropK() >= 1) drop = null;
  draw();
  raf = animating() ? requestAnimationFrame(frame) : 0;
}

function kick() { if (!raf) raf = requestAnimationFrame(frame); }

// Threat / forbidden markers only change when the board or the settings do.
function recomputeMarks() {
  S.marks = { threats: [], forbidden: [] };
  if (S.over) return;
  if (S.showThreats) S.marks.threats = threats(S.board, other(S.human), S.rules);
  if (S.showForbidden && S.human === BLACK)
    S.marks.forbidden = candidates(S.board).filter(p => forbidden(S.board, p, S.rules));
}


// --- i18n / ui ---------------------------------------------------------------
function applyI18n() {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.title = t('title') + ' · Gomoku';
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('#lang').textContent = lang === 'zh' ? 'EN' : '中文';
  render();
}

const STEP_MS = 650;
let pbTimer = 0;

function pbSet(i, keepPlaying = false) {
  if (!S.history.length) return;
  if (!keepPlaying) pbPause();
  S.view = { i: Math.max(0, Math.min(S.history.length, i)), at: null };
  render();
}

function pbPause() { clearTimeout(pbTimer); pbTimer = 0; if (S.view) S.view.playing = false; }

function pbTick() {
  if (!S.view?.playing) return;
  S.view.i++;
  S.view.at = null;
  if (!slowMo) drop = { p: S.history[S.view.i - 1], t0: performance.now() };
  if (S.view.i >= S.history.length) S.view.playing = false;   // stop on the last move, not after it
  render();
  if (S.view.playing) pbTimer = setTimeout(pbTick, STEP_MS);
}

function pbPlay() {
  if (!S.history.length) return;
  if (!S.view || S.view.i >= S.history.length) S.view = { i: 0, at: null };
  S.view.playing = true;
  render();
  pbTimer = setTimeout(pbTick, STEP_MS);
}

function pbClear() { pbPause(); S.view = null; }

function renderPlayback() {
  const el = $('#playback');
  el.hidden = !S.view;
  if (!S.view) return;
  const n = S.history.length, i = S.view.i;
  $('#pbPlay').textContent = t(S.view.playing ? 'pbPause' : 'pbPlay');
  $('#pbPrev').disabled = i === 0;
  $('#pbFirst').disabled = i === 0;
  $('#pbNext').disabled = i >= n;
  $('#pbLast').disabled = i >= n;
  const sl = $('#pbSlider');
  sl.max = n;
  sl.value = i;
  $('#pbAt').textContent = i === 0 ? t('pbStart')
    : t('pbAt', { i, n, who: t((i - 1) % 2 ? 'pbWhite' : 'pbBlack'), p: label(S.history[i - 1]) });
}

function renderReview() {
  const el = $('#review');
  el.hidden = !S.review;
  if (!S.review) { el.innerHTML = ''; return; }
  const row = (m, good) => `<button class="rv ${good ? 'good' : 'bad'}" data-ply="${m.ply}">
      <b>#${m.n}</b><span class="pt">${label(m.p)}</span>
      <span>${t('rv_' + m.key)}${!good && m.at != null ? ` <i>${t('reviewBetter', { p: label(m.at) })}</i>` : ''}</span>
    </button>`;
  const { best, worst } = S.review;
  el.innerHTML = `<h2>${t('reviewHead')}</h2>
    <h3>${t('reviewBest')}</h3>
    ${best.length ? best.map(m => row(m, true)).join('') : `<p class="rvNote">${t('reviewNone')}</p>`}
    <h3>${t('reviewWorst')}</h3>
    ${worst.length ? worst.map(m => row(m, false)).join('') : `<p class="rvNote">${t('reviewClean')}</p>`}
    <p class="rvNote">${t('reviewTap')}</p>`;
}

function render() {
  $('#status').textContent = S.over ? t(S.over) : S.thinking ? t('aiTurn') : t('yourTurn');
  $('#msg').innerHTML = S.msg;
  $('#undo').disabled = !S.history.length || S.thinking;
  $('#hint').disabled = !!S.over || S.thinking || S.turn !== S.human;
  $('#confirmRow').hidden = S.pending == null;
  renderPlayback();
  renderReview();
  draw();
  kick();
}

function say(html) { S.msg = html; render(); }

// --- game flow ---------------------------------------------------------------
function place(p) {
  S.hint = S.pending = S.hover = null;
  S.board[p] = S.turn;
  S.history.push(p);
  if (!slowMo) drop = { p, t0: performance.now() };
  S.winLine = winLine(S.board, p, S.rules);
  if (S.winLine) S.over = S.turn === S.human ? 'youWin' : 'aiWin';
  else if (S.history.length === SIZE * SIZE) S.over = 'draw';
  else S.turn = other(S.turn);
  recomputeMarks();
  if (S.over) {
    S.review = review(S.history, S.rules, S.human, 'medium');
    pbPlay();                            // the board becomes a replay of the game just played
  }
  if (!S.over && S.turn === S.human) {
    const lose = fiveThreats(S.board, other(S.human), S.rules);
    if (lose.length >= 2) S.msg = t('doomed', { a: label(lose[0]), b: label(lose[1]) });
  }
  render();
  if (!S.over && S.turn !== S.human) aiTurn();
}

function humanMove(p) {
  if (S.over || S.thinking || S.turn !== S.human || S.board[p]) return;
  if (S.human === BLACK) {
    const f = forbidden(S.board, p, S.rules);
    if (f) { S.pending = null; say(t('fb_' + f)); return; }
  }
  if (S.needConfirm && S.pending !== p) { S.pending = p; S.msg = ''; render(); return; }
  commit(p);
}

function commit(p) {
  const note = S.coach ? coach(S.board, p, S.human, S.rules) : null;
  const tv = S.tempo ? tempo(S.board, p, S.human, S.rules) : null;   // both need the pre-move board
  const text = note ? t(note.key, { p: note.at != null ? label(note.at) : '' })
             : tv && tv !== 'win' ? t('tempo_' + tv) : '';
  place(p);
  say(S.over ? '' : text);
}

function aiTurn() {
  S.thinking = true; render();
  // ponytail: search runs on the main thread; move to a Worker if the freeze annoys.
  setTimeout(() => {
    const p = bestMove(S.board, S.turn, S.rules, S.level);
    S.thinking = false;
    if (p == null) { S.over = 'draw'; render(); return; }
    place(p);
  }, 30);
}

function newGame() {
  S.board = newBoard(); S.history = []; S.turn = BLACK; S.over = null;
  S.hint = S.pending = S.hover = S.winLine = S.review = null; S.msg = '';
  pbClear();
  recomputeMarks();
  render();
  if (S.turn !== S.human) aiTurn();
}

// --- events ------------------------------------------------------------------
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left - pad) / cell), y = Math.round((e.clientY - r.top - pad) / cell);
  if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
  humanMove(idx(x, y));
});

cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const r = cv.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left - pad) / cell), y = Math.round((e.clientY - r.top - pad) / cell);
  const p = (x >= 0 && x < SIZE && y >= 0 && y < SIZE) ? idx(x, y) : null;
  if (p !== S.hover) { S.hover = p; draw(); }
});
cv.addEventListener('pointerleave', () => { if (S.hover != null) { S.hover = null; draw(); } });

$('#ok').onclick = () => { const p = S.pending; S.pending = null; if (p != null) commit(p); };
$('#cancel').onclick = () => { S.pending = null; render(); };
$('#review').addEventListener('click', e => {
  const btn = e.target.closest('button[data-ply]');
  if (!btn || !S.review) return;
  const m = [...S.review.best, ...S.review.worst].find(x => x.ply === +btn.dataset.ply);
  if (!m) return;
  pbSet(m.ply);
  S.view.at = m.score < 0 ? m.at : null;
  render();
});

$('#pbFirst').onclick = () => pbSet(0);
$('#pbPrev').onclick = () => S.view && pbSet(S.view.i - 1);
$('#pbNext').onclick = () => S.view && pbSet(S.view.i + 1);
$('#pbLast').onclick = () => pbSet(S.history.length);
$('#pbPlay').onclick = () => (S.view?.playing ? (pbPause(), render()) : pbPlay());
$('#pbSlider').oninput = e => pbSet(+e.target.value);

$('#newGame').onclick = newGame;
// black always opens, so the side to move follows from how many stones are down
const sideToMove = () => (S.history.length % 2 ? WHITE : BLACK);

$('#undo').onclick = () => {
  if (S.thinking || !S.history.length) return;
  do { S.board[S.history.pop()] = EMPTY; }        // take back at least one...
  while (S.history.length && sideToMove() !== S.human);   // ...then back to your turn
  S.over = null; S.hint = S.pending = S.hover = S.winLine = S.review = null; S.msg = '';
  pbClear();
  S.turn = sideToMove();
  recomputeMarks();
  render();
  if (S.turn !== S.human) aiTurn();
};
$('#hint').onclick = () => {
  if (!legalMoves(S.board, S.human, S.rules).length) return say(t('noMove'));
  const h = getHint(S.board, S.human, S.rules, S.level === 'easy' ? 'medium' : S.level);
  if (!h) return;
  S.hint = h.move;
  say(h.reason === 'lost' ? t('lost') : t('hintTip', { p: label(h.move), why: t(h.reason) }));
};
$('#lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; save('lang', lang); applyI18n(); };

const bind = (sel, key, get, set) => {
  const el = $(sel); set(el);
  el.onchange = () => { get(el); save(key, key === 'rules' ? S.rules : S[key]); recomputeMarks(); render(); };
};
bind('#level', 'level', el => S.level = el.value, el => el.value = S.level);
bind('#side', 'human', el => { S.human = +el.value; save('human', S.human); newGame(); }, el => el.value = S.human);
for (const k of ['doubleThree', 'doubleFour', 'overline'])
  bind('#' + k, 'rules', el => S.rules[k] = el.checked, el => el.checked = S.rules[k]);
for (const k of ['coach', 'showThreats', 'showForbidden', 'needConfirm', 'tempo', 'showNumbers'])
  bind('#' + k, k, el => S[k] = el.checked, el => el.checked = S[k]);

addEventListener('resize', resize);
recomputeMarks();
applyI18n();
resize();
if (S.turn !== S.human) aiTurn();
</script>
</body>
</html>
