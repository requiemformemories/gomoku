<!doctype html>
<!-- Builds apple-touch-icon.png (180x180). Full-bleed and square on purpose: iOS applies
     its own rounding, so a pre-rounded tile would get clipped twice. -->
<meta charset="utf-8">
<style>html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; }</style>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4757"/>
      <stop offset=".55" stop-color="#242e3b"/>
      <stop offset="1" stop-color="#151c25"/>
    </linearGradient>
    <radialGradient id="w" cx=".36" cy=".3" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".97"/>
      <stop offset=".55" stop-color="#e8eef6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#adbaca" stop-opacity=".74"/>
    </radialGradient>
    <radialGradient id="b" cx=".36" cy=".3" r=".85">
      <stop offset="0" stop-color="#8d9aab" stop-opacity=".82"/>
      <stop offset=".42" stop-color="#2a323d" stop-opacity=".76"/>
      <stop offset="1" stop-color="#070a0f" stop-opacity=".62"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" fill="url(#bg)"/>
  <g stroke="rgba(178,205,240,.2)" stroke-width="2.5" stroke-linecap="round">
    <path d="M32 58H148M32 90H148M32 122H148M58 32V148M90 32V148M122 32V148"/>
  </g>
  <circle cx="63" cy="63" r="33" fill="url(#w)" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
  <circle cx="118" cy="118" r="33" fill="url(#b)" stroke="rgba(206,226,255,.62)" stroke-width="3"/>
  <ellipse cx="52" cy="50" rx="11.5" ry="7" transform="rotate(-32 52 50)" fill="#fff" opacity=".62"/>
  <ellipse cx="107" cy="105" rx="10" ry="6" transform="rotate(-32 107 105)" fill="#fff" opacity=".34"/>
</svg>
