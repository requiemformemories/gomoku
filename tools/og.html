<!doctype html>
<!-- Builds og.png: a real screenshot of the board, composed into a 1200x630 card.
     Regenerate with the command in README.md after a visual change. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 56px; padding: 0 64px;
    box-sizing: border-box; color: #e8e6e1;
    font: 16px system-ui, -apple-system, "Noto Sans TC", sans-serif;
    background:
      radial-gradient(900px 500px at 12% -10%, #2b3744 0%, transparent 60%),
      radial-gradient(700px 420px at 100% 110%, #202b3a 0%, transparent 55%),
      #1d2126;
  }
  #board { width: 500px; height: 500px; border-radius: 14px; flex: none;
    filter: drop-shadow(0 22px 46px rgba(0,0,0,.55)); }
  h1 { font-size: 62px; margin: 0; letter-spacing: -.5px; }
  h2 { font-size: 30px; margin: 6px 0 30px; color: #9aa1a9; font-weight: 500; }
  ul { margin: 0; padding: 0; list-style: none; font-size: 25px; line-height: 1.72; }
  li::before { content: "▸"; color: #5aa9e6; margin-right: 12px; }
  p { margin: 34px 0 0; font-size: 23px; color: #5aa9e6; }
  #src { position: absolute; left: -9999px; top: 0; }
</style>
<img id="board" alt="">
<div>
  <h1>五子棋練習</h1>
  <h2>Gomoku Trainer · 中文 / English</h2>
  <ul>
    <li>禁手可調：三三、四四、長連</li>
    <li>四段 AI 對手，瀏覽器內運算</li>
    <li>提示會告訴你「為什麼」</li>
    <li>賽後回顧 + 棋譜回放</li>
  </ul>
  <p>fumitsuki.tw/gomoku</p>
</div>
<iframe id="src" width="760" height="900"></iframe>
<script>
  const GAME = 'H8,G9,I9,G7,G8,I8,F8,E8,J10,F9,K11,L12,G10,E9';
  const wait = ms => new Promise(r => setTimeout(r, ms));
  addEventListener('load', async () => {
    localStorage.clear();
    localStorage.setItem('gk.showNumbers', 'false');   // cleaner at thumbnail size
    localStorage.setItem('gk.showForbidden', 'false');
    const f = document.getElementById('src');
    f.src = '../index.html?g=' + GAME + '&r=111&s=b';
    await new Promise(r => f.addEventListener('load', r));
    await wait(600);
    const cv = f.contentDocument.querySelector('#board');
    document.getElementById('board').src = cv.toDataURL();
    document.body.dataset.ready = '1';
  });
</script>
